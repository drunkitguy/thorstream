name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  client:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: thorstream-client-debug
          path: client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  host:
    name: Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # NVENC and ViGEm headers are vendored, so this compiles on a runner with
      # no NVIDIA GPU and no ViGEmBus driver. Both are resolved at runtime.
      - name: Configure
        run: cmake -S host -B host/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build host/build

      - uses: actions/upload-artifact@v4
        with:
          name: thorstream-host
          path: |
            host/build/thorstream-host.exe
            host/build/thorstream-host.pdb
          if-no-files-found: error

  release:
    name: Publish release
    needs: [client, host]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The tag files are one per game and useless individually, so they ship as
      # a single archive to unpack onto the handheld.
      - name: Package the Cocoon tag files
        run: zip -j -r thorstream-cocoon-tags.zip cocoon/thorstream

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/thorstream-client-debug/*.apk
            artifacts/thorstream-host/*
            cocoon/thorstream.json
            cocoon/README.md
            thorstream-cocoon-tags.zip
          generate_release_notes: true
